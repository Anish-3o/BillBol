name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server - lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      # Tests run against a real MongoDB (unique indexes, duplicate-key errors, transactions).
      # Transactions need a replica set, and a "services:" container cannot be started with
      # --replSet, so we start it here and initialise a single-node replica set.
      - name: Start MongoDB (single-node replica set)
        working-directory: .
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }" && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.status().set"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  client:
    name: Client - lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
